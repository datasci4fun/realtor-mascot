version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: realtor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realtor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realtor_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-realtor_leads}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5489:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtor} -d ${POSTGRES_DB:-realtor_leads}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtor_app
    restart: unless-stopped
    ports:
      - "3847:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-realtor}:${POSTGRES_PASSWORD:-realtor_secret_123}@db:5432/${POSTGRES_DB:-realtor_leads}
      DATABASE_SSL: "false"
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_REALTOR_NAME: ${NEXT_PUBLIC_REALTOR_NAME:-Greg Knapp}
      NEXT_PUBLIC_REALTOR_PHONE: ${NEXT_PUBLIC_REALTOR_PHONE:-(469) 485-7313}
      NEXT_PUBLIC_REALTOR_EMAIL: ${NEXT_PUBLIC_REALTOR_EMAIL:-angela@artisticrealestate.com}
      NEXT_PUBLIC_BROKERAGE: ${NEXT_PUBLIC_BROKERAGE:-Artistic Real Estate Group}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
