version: '3.8'

# Development compose - just runs PostgreSQL, you run Next.js locally

services:
  db:
    image: postgres:16-alpine
    container_name: realtor_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: realtor
      POSTGRES_PASSWORD: realtor_dev_123
      POSTGRES_DB: realtor_leads
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5489:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtor -d realtor_leads"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
